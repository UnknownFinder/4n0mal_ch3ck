#!/usr/sbin/nft -f
# /etc/nftables.conf
# Проверка без применения: sudo nft -c -f /etc/nftables.conf
# Применение:                sudo nft -f /etc/nftables.conf

flush ruleset

table inet firewall {

    # ============================================================
    # Sets
    # ============================================================
    set whitelist4 {
        type ipv4_addr
        flags interval
        elements = { 127.0.0.0/8, 192.168.1.0/24 }
    }
    set whitelist6 {
        type ipv6_addr
        flags interval
        elements = { ::1/128 }
    }
    set blacklist4 {
        type ipv4_addr
        flags interval
        elements = { 185.130.5.0/24 }
    }
    set blacklist6 {
        type ipv6_addr
        flags interval
        elements = { }
    }

    # Автоматические баны сканеров / флудеров
    set scanners4 {
        type ipv4_addr
        size 65535
        flags timeout
    }
    set scanners6 {
        type ipv6_addr
        size 65535
        flags timeout
    }

    # ============================================================
    # INPUT
    # ============================================================
    chain input {
        type filter hook input priority filter; policy drop;

        # 1) Loopback — всегда доверенный
        iif "lo" accept comment "loopback"
        ip  saddr 127.0.0.0/8 iif != "lo" drop comment "loopback src off-lo"
        ip6 saddr ::1/128     iif != "lo" drop comment "::1 off-lo"

        # 2) Conntrack
        ct state invalid drop counter comment "invalid conntrack"

        # 3) Забаненные флудеры — дропаем сразу
        ip  saddr @scanners4 drop counter comment "banned IPv4"
        ip6 saddr @scanners6 drop counter comment "banned IPv6"

        # 4) Анти-спуфинг
        ip saddr 0.0.0.0/8   drop counter comment "src 0/8"
        ip saddr 224.0.0.0/4 drop counter comment "src multicast"
        ip saddr 240.0.0.0/4 drop counter comment "src reserved"

        # 5) Black / white lists
        ip  saddr @blacklist4 drop counter comment "blacklist v4"
        ip6 saddr @blacklist6 drop counter comment "blacklist v6"
        ip  saddr @whitelist4 accept comment "whitelist v4"
        ip6 saddr @whitelist6 accept comment "whitelist v6"

        # 6) Established / related
        ct state established,related accept comment "established/related"

        # 7) ICMP / ICMPv6
        #    echo-reply сюда не включаем — он придёт как established
        icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } \
            limit rate 10/second burst 20 accept counter comment "ICMP allowed"
        icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, \
                      nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } \
            limit rate 10/second burst 20 accept counter comment "ICMPv6 allowed"

        # 8) Обнаружение TCP-сканов
        tcp flags & (fin|syn|rst|psh|ack|urg) == 0x0          drop counter comment "NULL scan"
        tcp flags & (fin|syn|rst|psh|ack|urg) == fin          drop counter comment "FIN scan"
        tcp flags & (fin|syn|rst|psh|ack|urg) == fin|psh|urg  drop counter comment "Xmas scan"
        tcp flags & (syn|fin) == syn|fin                      drop counter comment "SYN+FIN"

        # 9) Rate-limit новых TCP-соединений ПО ПОРТАМ
        # --- SSH (жёсткий лимит) ---
        tcp dport 22 ct state new tcp flags syn \
            limit rate 5/second burst 10 accept counter comment "SSH new conns"
        tcp dport 22 ct state new tcp flags syn \
            add @scanners4 { ip saddr  timeout 1h } comment "ban v4 SSH flood"
        tcp dport 22 ct state new tcp flags syn \
            add @scanners6 { ip6 saddr timeout 1h } comment "ban v6 SSH flood"
        tcp dport 22 ct state new tcp flags syn drop counter comment "drop SSH flood"

        # --- HTTP/HTTPS ---
        tcp dport { 80, 443 } ct state new tcp flags syn \
            limit rate 50/second burst 100 accept counter comment "web new conns"
        tcp dport { 80, 443 } ct state new tcp flags syn \
            add @scanners4 { ip saddr  timeout 1h } comment "ban v4 web flood"
        tcp dport { 80, 443 } ct state new tcp flags syn \
            add @scanners6 { ip6 saddr timeout 1h } comment "ban v6 web flood"
        tcp dport { 80, 443 } ct state new tcp flags syn drop counter comment "drop web flood"

        # --- DNS ---
        udp dport 53 limit rate 100/second burst 200 accept counter comment "DNS/UDP"
        tcp dport 53 ct state new tcp flags syn limit rate 20/second burst 40 accept counter comment "DNS/TCP"

        # --- DHCP-клиент ---
        udp sport 67 udp dport 68 accept comment "DHCP client"

        # 10) Лог остатка (политика drop добьёт)
        limit rate 10/minute log prefix "nftables DROPPED: " level info flags all
    }

    # ============================================================
    # FORWARD
    # ============================================================
    chain forward {
        type filter hook forward priority filter; policy drop;
        # Если это не роутер — ничего не добавляем.
        # Если роутер: ct state established,related accept; + правила.
    }

    # ============================================================
    # OUTPUT (egress)
    # ============================================================
    chain output {
        type filter hook output priority filter; policy accept;

        # Блокируем исходящий SMTP, чтобы заражённая машина не спамила
        tcp dport { 25, 465, 587 } ct state new drop counter comment "no outbound SMTP"
    }

    # ============================================================
    # NAT (заготовки, раскомментировать по необходимости)
    # ============================================================
    chain nat_prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        # tcp dport 80 dnat to 192.168.1.100:80
    }
    chain nat_postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        # oif "eth0" masquerade
    }
}
